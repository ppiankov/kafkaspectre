name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test
    # GoReleaser publishes windows/amd64 and windows/arm64 archives, so the
    # Windows target is compiled and tested here rather than shipped untested.
    # Steps use go directly rather than make so they run on both shells.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ['1.25.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      # Windows has no make, so the portable go steps run everywhere and the
      # make targets run on Linux only. make build stamps the release LDFLAGS
      # and make deps runs go mod tidy — dropping either would silently retire
      # verification that existed before the Windows leg was added.
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./...
      - name: Release-shaped build and dependency drift check
        if: runner.os == 'Linux'
        run: |
          make deps
          make build
          git diff --exit-code go.mod go.sum

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
          args: --timeout=5m
      - run: make fmt
      - run: git diff --exit-code

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
