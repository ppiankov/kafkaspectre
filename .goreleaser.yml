version: 2

builds:
  - id: kafkaspectre
    binary: kafkaspectre
    main: ./cmd/kafkaspectre
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.GitCommit={{.Commit}} -X main.BuildDate={{.Date}}

archives:
  - id: default
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

release:
  github:
    owner: ppiankov
    name: kafkaspectre
  prerelease: auto
  name_template: "Release {{ .Tag }}"

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# WO-64: macOS code signing and notarization. Gatekeeper blocks unsigned
# binaries by default; this signs them with an Apple Developer ID and
# submits for notarization. Requires AC_API_KEY env (app-specific password
# for notarytool) and AC_APPLE_ID / AC_TEAM_ID secrets.
signs:
  - id: darwin
    artifacts: all
    ids:
      - darwin_amd64
      - darwin_arm64
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${certificate}"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"

notarize:
  macos:
    - enabled: '{{ isSet .Env.AC_API_KEY }}'
      sign:
        certificate: "{{ .Env.AC_CERTIFICATE }}"
        password: "{{ .Env.AC_PASSWORD }}"
      notarize:
        key_id: "{{ .Env.AC_API_KEY_ID }}"
        key: "{{ .Env.AC_API_KEY_ISSUER }}"
        wait: true

brews:
  -
    name: "kafkaspectre"
    homepage: "https://github.com/ppiankov/kafkaspectre"
    description: "Kafka cluster auditor — identifies unused, orphaned, and misconfigured topics"
    license: "MIT"
    repository:
      owner: ppiankov
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    install: |
      bin.install "kafkaspectre"
    test: |
      assert_match "kafkaspectre", shell_output("#{bin}/kafkaspectre version")
